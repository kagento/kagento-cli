version: 2

builds:
  - main: .
    binary: kagento
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/kagento/kagento-cli/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "kagento_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: kagento
    name: kagento-cli
